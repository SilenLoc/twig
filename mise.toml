[env]
# Project-specific environment variables
PROJECT_ROOT = "tests/git/srv"
API_KEY = "secure"
RESET_DB = "true"
PORT = "8080"

[tools]
rust = { version = "1.97" }
# nextest is not in the mise registry, so it comes from the cargo backend.
# cargo-binstall makes that backend pull the prebuilt release binary instead of
# compiling nextest from source.
"cargo-binstall" = "latest"
"cargo:cargo-nextest" = "latest"

[tasks.run]
run = 'cargo run'

[tasks.verify]
# `cargo clippy` runs the same analysis `cargo check` does and reuses the same
# dependency artifacts, so running both only re-analyses the workspace crate
# twice for nothing. `--all-targets` extends the lints to the test code.
# nextest runs each test in its own process, in parallel, and loses nothing
# here: fig is a binary-only crate, so there are no doctests to skip.
run = ['cargo fmt --check', 'cargo clippy --all-targets', 'cargo nextest run']

[tasks.test]
run = 'cargo nextest run'

[tasks.fmt]
run = ['cargo fmt', 'cargo clippy --fix --all-targets --allow-dirty']


[tasks.oci]
run = [
    'cargo build --release',
    'MISE_EXPERIMENTAL=1 mise oci build -o ./mise-oci',
]

[tasks.docker]
run = ['docker run -p 8080:80 silenloc/fig']


[oci]
from        = "debian:bookworm-slim"   # base image ref
# tag       = "silenloc/fig:latest"    # passed via `mise oci build -t <tag>` instead
workdir     = "/app"                    # WORKDIR
entrypoint  = ["./fig"]                 # ENTRYPOINT
cmd         = []                        # CMD
# Run as non-root (matches the dev-image convention).
user        = "nonroot"
user_id     = 1000                      # tar layer entry UID (file ownership)
group_id    = 1000                      # tar layer entry GID (defaults to user_id)
mount_point = "/mise"                   # where tools install in the image

[[oci.copy]]
host  = "target/release/fig"
image = "/app/fig"

# Extra env baked into the image config (image-only — won't shadow MISE_*).
# PORT=80 mirrors the Dockerfile's `EXPOSE 80` / app default.
# `fig` itself reads these env vars: PORT, LOG_LEVEL, PROJECT_ROOT, DB_PATH,
# API_KEY, RESET_DB, SENTRY_DSN, SENTRY_TRACES_SAMPLE_RATE.
[oci.env]
PORT = "80"

# Labels baked into the image config.
[oci.labels]
"org.opencontainers.image.source" = "https://fig.silenlocatelli.ch/silen/fig"
"org.opencontainers.image.title"   = "fig"
"org.opencontainers.image.description" = "Fig — Git server and web UI"
