[package]
name = "twig-git"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = { version = "0.21", default-features = false }
log = "0.4"
toml = "1.1"
xshell = "0.2.7"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.uuid]
version = "1.23.0"
features = ["v4"]

[lib]
path = "src/lib.rs"
