[package]
name = "twig"
version = "0.2.8"
edition = "2024"

[workspace]
members = ["crates/twig-highlight"]
resolver = "3"

[dependencies]
actix-identity = "0.9"
actix-session = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
bytes = "1"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
hex = "0.4"
log = "0.4"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
semver = "1"
toml = "1.1"
turso = { version = "0.8.2", default-features = false }
xshell = "0.2.7"

[dependencies.actix-http]
version = "3"
default-features = false
features = ["http2"]

[dependencies.actix-web]
version = "4"
default-features = false
features = [
  "cookies",
  "http2",
  "macros",
]

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
  "clock",
  "std",
]

[dependencies.git2]
version = "0.21"
default-features = false

[dependencies.maud]
version = "0.27.0"
features = ["actix-web"]

[dependencies.mermaid-rs-renderer]
version = "0.3.1"
default-features = false

[dependencies.rand]
version = "0.10"
default-features = false
features = ["sys_rng"]

[dependencies.rmp-serde]
version = "1.3"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "sync"]

[dependencies.twig-highlight]
path = "crates/twig-highlight"

[dependencies.uuid]
version = "1.23.0"
features = ["v4"]

[dev-dependencies]
serde_urlencoded = "0.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
