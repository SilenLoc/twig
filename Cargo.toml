[dependencies]
actix-multipart = "0.7"
argon2 = "0.5"
base64 = "0.22"
env_logger = "0.11"
glob = "0.3"
hex = "0.4"
log = "0.4"
migs = "0.1.7"
pulldown-cmark = "0.12"
toml = "0.8"
turso = "0.5.3"
xshell = "0.2.7"

[dependencies.actix-http]
default-features = false
features = ["http2"]
version = "3"

[dependencies.actix-web]
default-features = false
features = [
    "macros",
    "cookies",
    "http2",
]
version = "4"

[dependencies.chrono]
default-features = false
features = [
    "clock",
    "std",
]
version = "0.4"

[dependencies.git2]
default-features = false
version = "0.18"

[dependencies.maud]
features = ["actix-web"]
version = "0.27.0"

[dependencies.rand]
default-features = false
features = ["getrandom"]
version = "0.8"

[dependencies.reqwest]
default-features = false
features = ["rustls-tls"]
version = "0.12"

[dependencies.sentry]
features = [
    "actix",
    "log",
    "logs",
]
version = "0.49.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.tokio]
features = ["full"]
version = "1"

[dependencies.uuid]
features = ["v4"]
version = "1.23.0"

[dev-dependencies]
serde_json = "1.0"

[dev-dependencies.tokio]
features = ["full"]
version = "1"

[package]
edition = "2024"
name = "fig"
version = "0.1.77"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[spruce]
additional_tools = ["git"]
excludes = [
    "AGENTS.md",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "docker.just",
    "docs",
    "fig.db",
    "fig.db-wal",
    "justfile",
    "mise.toml",
    "skills",
    "tests",
]
includes = [
    "Cargo.toml",
    "assets",
    "src",
]
mode = "alpha"
namespace = "silenloc"
runtime_deps = ["git"]
