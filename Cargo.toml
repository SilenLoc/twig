[package]
name = "twig"
version = "0.3.12"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/twig-git", "crates/twig-highlight", "crates/twig-http"]
exclude = ["local/turso_core"]

[workspace.lints]
[workspace.lints.clippy]
allow_attributes = "deny"
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
no_effect_underscore_binding = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.rustdoc]
all = "warn"

[dependencies]
actix-identity = "0.9"
actix-session = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
bytes = "1"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
hex = "0.4"
log = "0.4"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
semver = "1"
sha2 = "0.10"
toml = "1.1"
turso = { version = "0.8.2", default-features = false }

[dependencies.actix-http]
version = "3"
default-features = false
features = ["http2"]

[dependencies.actix-web]
version = "4"
default-features = false
features = [
  "cookies",
  "http2",
  "macros",
]

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
  "clock",
  "std",
]

[dependencies.git2]
version = "0.21"
default-features = false

[dependencies.maud]
version = "0.27.0"
features = ["actix-web"]

[dependencies.mermaid-rs-renderer]
version = "0.3.1"
default-features = false

[dependencies.rand]
version = "0.10"
default-features = false
features = ["sys_rng"]

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls-no-provider"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "sync"]

[dependencies.twig-git]
path = "crates/twig-git"

[dependencies.twig-highlight]
path = "crates/twig-highlight"

[dependencies.uuid]
version = "1.23.0"
features = ["v4"]

[dev-dependencies]
serde_urlencoded = "0.7"
xshell = "0.2.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

[patch.crates-io]
turso_core = { path = "local/turso_core" }
