[package]
name = "fig"
version = "0.1.0"
edition = "2024"


[dependencies]
actix-multipart = "0.7"
actix-web = "4"
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4"
env_logger = "0.11"
hex = "0.4"
libsql = "0.9"
log = "0.4"
maud = { version = "0.27.0", features = ["actix-web"] }
pulldown-cmark = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
git_backend = { path = "git_backend" }
tokio = { version = "1", features = ["full"] }
xshell = "0.2.7"
uuid = { version = "1.23.0", features = ["v4"] }
git2 = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
