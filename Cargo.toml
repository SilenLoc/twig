[dependencies]
actix-multipart = "0.7"
actix-web = "4"
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4"
env_logger = "0.11"
git2 = "0.18"
hex = "0.4"
libsql = "0.9"
log = "0.4"
pulldown-cmark = "0.12"
rand = "0.8"
xshell = "0.2.7"

[dependencies.maud]
features = ["actix-web"]
version = "0.27.0"

[dependencies.reqwest]
default-features = false
features = ["rustls-tls"]
version = "0.12"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.tokio]
features = ["full"]
version = "1"

[dependencies.uuid]
features = ["v4"]
version = "1.23.0"

[dev-dependencies.tokio]
features = ["full"]
version = "1"

[package]
edition = "2024"
name = "fig"
version = "0.1.18"

[spruce]
additional_tools = ["git"]
includes = [
    "Cargo.toml",
    "assets",
    "src",
]
mode = "alpha"
namespace = "silenloc"
runtime_deps = ["git"]
