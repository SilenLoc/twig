[dependencies]
argon2 = "0.5"
base64 = "0.22"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
glob = "0.3"
hex = "0.4"
log = "0.4"
pulldown-cmark = "0.12"
toml = "0.8"
turso = { version = "0.5.3", default-features = false }
xshell = "0.2.7"

[dependencies.actix-http]
default-features = false
features = ["http2"]
version = "3"

[dependencies.actix-web]
default-features = false
features = [
    "macros",
    "cookies",
    "http2",
]
version = "4"

[dependencies.chrono]
default-features = false
features = [
    "clock",
    "std",
]
version = "0.4"

[dependencies.git2]
default-features = false
version = "0.18"

[dependencies.maud]
features = ["actix-web"]
version = "0.27.0"

[dependencies.rand]
default-features = false
features = ["getrandom"]
version = "0.8"

[dependencies.sentry]
default-features = false
features = [
    "actix",
    "log",
    "logs",
    "ureq",
]
version = "0.49.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.tokio]
features = ["macros", "rt-multi-thread", "sync"]
version = "1"

[dependencies.uuid]
features = ["v4"]
version = "1.23.0"

[dev-dependencies]
serde_json = "1.0"
serde_urlencoded = "0.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
edition = "2024"
name = "fig"
version = "0.1.92"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
