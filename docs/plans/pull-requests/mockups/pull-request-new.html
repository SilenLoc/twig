<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: new pull request</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1f2328; }
  header { padding: 12px 24px; border-bottom: 1px solid #d0d7de; color: #57606a; font-size: 14px; }
  main { padding: 16px 24px; max-width: 980px; }
  .pickers { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 16px; }
  select { padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-family: ui-monospace, monospace; }
  .notice { border: 1px solid #d0d7de; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
  .notice.ok { border-color: #1a7f37; background: #dafbe1; }
  .grid { display: grid; grid-template-columns: 1fr 260px; gap: 24px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 200px; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-family: inherit; }
  .tabs { display: flex; gap: 0; border: 1px solid #d0d7de; border-bottom: 0; border-radius: 6px 6px 0 0; width: max-content; font-size: 14px; }
  .tabs span { padding: 6px 12px; }
  .tabs span[aria-selected="true"] { font-weight: 600; border-bottom: 2px solid #fd8c73; }
  .side h4 { margin: 0 0 6px; font-size: 13px; color: #57606a; }
  .side p { margin: 0 0 16px; font-size: 14px; }
  .btn-primary { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 6px; background: #1f883d; color: #fff; font-size: 14px; }
  .commit { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #d0d7de; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>acme / tooling &middot; Pull requests &middot; New pull request</header>
<main>
  <div class="pickers">
    <select aria-label="Base branch"><option>main</option><option>release-2</option></select>
    <span>&larr;</span>
    <select aria-label="Head branch"><option>feature/retry</option><option>arm-installer</option></select>
  </div>

  <div class="notice ok">Able to merge. These branches can be automatically merged.</div>

  <div class="grid">
    <div>
      <label for="title">Title</label>
      <input id="title" type="text" value="Add retry to the release uploader">
      <div style="height:16px"></div>
      <div class="tabs"><span aria-selected="true">Write</span><span>Preview</span></div>
      <textarea aria-label="Description">Retries three times with backoff on 5xx responses.</textarea>
      <button class="btn-primary">Create pull request</button>
    </div>
    <aside class="side">
      <h4>Commits</h4>
      <p>3 commits from <code>feature/retry</code> not in <code>main</code></p>
      <div class="commit">a1b2c3d Add retry helper</div>
      <div class="commit">d4e5f6a Wire helper into uploader</div>
      <div class="commit">9f8e7d6 Document retry limits</div>
      <h4 style="margin-top:16px">Files</h4>
      <p>3 files changed, +74 &minus;12</p>
    </aside>
  </div>
</main>
</body>
</html>
