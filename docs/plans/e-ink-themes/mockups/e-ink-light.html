<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twig — E-ink Light mockup</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; color: #171717; background: #ededed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    button { color: inherit; font: inherit; }
    .top { height: 58px; display: flex; align-items: center; gap: 30px; padding: 0 max(24px, calc((100vw - 1160px) / 2)); background: #fff; border-bottom: 2px solid #171717; }
    .brand { font-weight: 800; letter-spacing: -.08em; font-size: 20px; text-decoration: none; }
    .nav { display: flex; gap: 24px; font-size: 13px; }
    .nav a:first-child { font-weight: 700; }
    .user { margin-left: auto; font-size: 12px; }
    .theme-button { border: 1px solid #171717; background: #171717; color: #fff; padding: 7px 10px; font: 700 11px/1 ui-monospace, monospace; letter-spacing: .03em; white-space: nowrap; }
    main { max-width: 1160px; margin: 38px auto; padding: 0 24px 48px; }
    .crumb { font-size: 12px; color: #555; margin-bottom: 22px; }
    .repo-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.2; letter-spacing: -.08em; }
    .description { margin: 8px 0 0; color: #444; font: 15px/1.5 system-ui, sans-serif; }
    .repo-meta { display: flex; gap: 17px; flex-wrap: wrap; margin-top: 16px; color: #555; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .button { border: 1px solid #171717; padding: 7px 12px; background: #fff; font-size: 12px; text-decoration: none; }
    .button.primary { color: #fff; background: #171717; }
    .tabs { display: flex; gap: 23px; border-bottom: 2px solid #171717; margin-top: 30px; font-size: 13px; }
    .tabs a { padding: 11px 0; text-decoration: none; color: #555; }
    .tabs .selected { color: #171717; font-weight: 800; box-shadow: 0 3px #171717; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 18px; }
    .panel { background: #fff; border: 1px solid #999; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 14px; border-bottom: 1px solid #999; font-size: 12px; font-weight: 700; }
    .muted { color: #666; font-weight: 400; }
    .file-head, .file-row { display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; min-height: 39px; padding: 0 14px; gap: 12px; border-bottom: 1px solid #ddd; font-size: 12px; }
    .file-head { min-height: 32px; color: #666; background: #f1f1f1; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    .file-row:last-child { border: 0; }
    .file-row.active { background: #e8e8e8; box-shadow: inset 3px 0 #171717; font-weight: 700; }
    .kind { color: #666; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .file-name { font-weight: 600; }
    @media (max-width: 700px) { .top { padding: 0 16px; gap: 18px; } .nav { gap: 12px; } .user { display: none; } .theme-button { margin-left: auto; } main { margin-top: 26px; padding: 0 16px 32px; } .repo-head { display: block; } .actions { margin-top: 16px; } .file-head, .file-row { grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 0 9px; font-size: 11px; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#">twig/</a>
    <nav class="nav" aria-label="Main navigation"><a href="#">Repositories</a><a href="#">Namespaces</a></nav>
    <span class="user">silen ▾</span>
    <button class="theme-button" type="button" aria-label="Current theme: E-ink light">◐ &nbsp; E-INK LIGHT</button>
  </header>
  <main>
    <div class="crumb">silen / <strong>twig</strong></div>
    <section class="repo-head" aria-labelledby="repo-title">
      <div>
        <h1 id="repo-title">twig</h1>
        <p class="description">A small, self-hosted Git forge.</p>
        <div class="repo-meta"><span>◉ Rust</span><span>⑂ main</span><span>Updated 2 hours ago</span></div>
      </div>
      <div class="actions"><a class="button" href="#">☆ Star</a><a class="button primary" href="#">＋ Clone</a></div>
    </section>
    <nav class="tabs" aria-label="Repository navigation"><a class="selected" href="#">Code</a><a href="#">Commits</a><a href="#">Branches</a><a href="#">Settings</a></nav>
    <div class="workspace">
      <section class="panel" aria-label="Repository files">
        <div class="panel-title"><span>REPOSITORY CONTENTS</span><span class="muted">BRANCH &nbsp; main ▾</span></div>
        <div class="file-head"><span>TYPE</span><span>PATH</span></div>
        <div class="file-row"><span class="kind">DIR</span><span class="file-name">assets/</span></div>
        <div class="file-row"><span class="kind">DIR</span><span class="file-name">docs/</span></div>
        <div class="file-row"><span class="kind">DIR</span><span class="file-name">src/</span></div>
        <div class="file-row"><span class="kind">FILE</span><span class="file-name">.gitignore</span></div>
        <div class="file-row active"><span class="kind">FILE</span><span class="file-name">README.md</span></div>
        <div class="file-row"><span class="kind">FILE</span><span class="file-name">Cargo.toml</span></div>
      </section>
    </div>
  </main>
</body>
</html>
